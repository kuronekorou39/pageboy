[package]
name = "pageboy"
version = "0.1.0"
description = "ページ漫画をハンズフリーで読むビューア"
authors = ["rou39"]
license = "MIT"
repository = "https://github.com/kuronekorou39/pageboy"
homepage = "https://rou39.com"
edition = "2024"
rust-version = "1.90"

[lib]
name = "pageboy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
imagesize = "0.13"
